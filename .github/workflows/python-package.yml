name: Python package gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
      wheel: ${{ steps.identity.outputs.wheel }}
      sdist: ${{ steps.identity.outputs.sdist }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-package-build.txt
      - name: Read release identity
        id: identity
        run: python scripts/check_package_release.py --github-output "$GITHUB_OUTPUT"
      - name: Build release candidates
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements-package-build.txt
          python -m build --no-isolation --outdir dist/packages
          python -m twine check --strict dist/packages/*
      - name: Audit contents and write release evidence
        env:
          WHEEL: ${{ steps.identity.outputs.wheel }}
          SDIST: ${{ steps.identity.outputs.sdist }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python scripts/check_package_artifacts.py "dist/packages/$WHEEL" "dist/packages/$SDIST" \
            --version "$VERSION" --source-ref "$SOURCE_COMMIT" --report dist/package-audit.json
          python scripts/check_package_release.py \
            --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST" \
            --manifest dist/python-package-manifest.json --checksums dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-${{ steps.identity.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  clean-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-${{ needs.build.outputs.version }}
          path: dist
      - name: Validate wheel and sdist in clean environments
        shell: bash
        env:
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python scripts/check_package_matrix.py --ci-shard \
            --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST" \
            --version "$VERSION" --python "$(python -c 'import sys; print(sys.executable)')" \
            --source-ref "$SOURCE_COMMIT" --work-dir .runlogs/package-ci --jobs 1
