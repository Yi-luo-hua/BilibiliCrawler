name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag, exactly matching the Cargo/package version
        required: true
        type: string
      destination:
        description: Complete each destination in order
        required: true
        type: choice
        options:
          - github-release
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-python-${{ inputs.tag }}-${{ inputs.destination }}
  cancel-in-progress: false

jobs:
  build:
    name: Prepare tagged artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      name: ${{ steps.identity.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
      wheel: ${{ steps.identity.outputs.wheel }}
      sdist: ${{ steps.identity.outputs.sdist }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-package-build.txt
      - name: Verify immutable release identity
        id: identity
        run: >-
          python scripts/check_package_release.py
          --tag "${{ inputs.tag }}" --require-head-tag
          --require-ancestor-of origin/main
          --github-output "$GITHUB_OUTPUT"
      - name: Install hash-locked release tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-package-build.txt
      - name: Build GitHub Release candidates once
        if: inputs.destination == 'github-release'
        run: python -m build --no-isolation --outdir dist/packages
      - name: Reuse immutable GitHub Release assets
        if: inputs.destination != 'github-release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WHEEL: ${{ steps.identity.outputs.wheel }}
          SDIST: ${{ steps.identity.outputs.sdist }}
        run: |
          mkdir -p dist/packages
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/packages \
            --pattern "$WHEEL" --pattern "$SDIST"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern SHA256SUMS --pattern python-package-manifest.json
      - name: Audit tagged artifacts
        env:
          WHEEL: ${{ steps.identity.outputs.wheel }}
          SDIST: ${{ steps.identity.outputs.sdist }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          python -m twine check --strict dist/packages/*
          python scripts/check_package_artifacts.py "dist/packages/$WHEEL" "dist/packages/$SDIST" \
            --version "$VERSION" --source-ref "$SOURCE_COMMIT" --report dist/package-audit.json
      - name: Create release evidence
        if: inputs.destination == 'github-release'
        env:
          WHEEL: ${{ steps.identity.outputs.wheel }}
          SDIST: ${{ steps.identity.outputs.sdist }}
        run: |
          python scripts/check_package_release.py \
            --tag "${{ inputs.tag }}" --require-head-tag --require-ancestor-of origin/main \
            --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST" \
            --manifest dist/python-package-manifest.json --checksums dist/SHA256SUMS
      - name: Verify reused release evidence
        if: inputs.destination != 'github-release'
        env:
          WHEEL: ${{ steps.identity.outputs.wheel }}
          SDIST: ${{ steps.identity.outputs.sdist }}
        run: |
          python scripts/check_package_release.py \
            --tag "${{ inputs.tag }}" --require-head-tag --require-ancestor-of origin/main \
            --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST" \
            --manifest dist/python-package-manifest.json --checksums dist/SHA256SUMS \
            --verify-release-files
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tagged-python-package-${{ steps.identity.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  clean-install:
    name: Tagged ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tagged-python-package-${{ needs.build.outputs.version }}
          path: dist
      - name: Validate exact tagged wheel and sdist
        shell: bash
        env:
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python scripts/check_package_matrix.py --ci-shard \
            --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST" \
            --version "$VERSION" --python "$(python -c 'import sys; print(sys.executable)')" \
            --source-ref "$SOURCE_COMMIT" --work-dir .runlogs/tagged-package-ci --jobs 1

  github-release:
    name: Attach immutable GitHub assets
    if: inputs.destination == 'github-release'
    needs: [build, clean-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tagged-python-package-${{ needs.build.outputs.version }}
          path: dist
      - name: Upload without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "dist/packages/$WHEEL" "dist/packages/$SDIST" \
            dist/SHA256SUMS dist/python-package-manifest.json

  publish-index:
    name: Publish to ${{ inputs.destination }}
    if: inputs.destination == 'testpypi' || inputs.destination == 'pypi'
    needs: [build, clean-install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.destination }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tagged-python-package-${{ needs.build.outputs.version }}
          path: dist
      - name: Require matching GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
        run: |
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern "$WHEEL" --pattern "$SDIST"
          cmp "dist/packages/$WHEEL" "release-assets/$WHEEL"
          cmp "dist/packages/$SDIST" "release-assets/$SDIST"
      - name: Require matching TestPyPI artifacts before PyPI
        if: inputs.destination == 'pypi'
        env:
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
        run: >-
          python scripts/check_package_release.py
          --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST"
          --verify-repository https://test.pypi.org/pypi
      - name: Publish to TestPyPI with trusted publishing
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/packages
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
      - name: Publish to PyPI with trusted publishing
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/packages
          print-hash: true

  verify-index:
    name: Verify ${{ inputs.destination }} artifact and install
    if: inputs.destination == 'testpypi' || inputs.destination == 'pypi'
    needs: [build, publish-index]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tagged-python-package-${{ needs.build.outputs.version }}
          path: dist
      - name: Wait for exact repository hashes
        env:
          DESTINATION: ${{ inputs.destination }}
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
        run: |
          if [ "$DESTINATION" = testpypi ]; then repository=https://test.pypi.org/pypi; else repository=https://pypi.org/pypi; fi
          for delay in 0 5 10 20 30; do
            sleep "$delay"
            if python scripts/check_package_release.py \
              --wheel "dist/packages/$WHEEL" --sdist "dist/packages/$SDIST" \
              --verify-repository "$repository"; then exit 0; fi
          done
          exit 1
      - name: Install the published wheel and run MCP smoke
        env:
          DESTINATION: ${{ inputs.destination }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          WHEEL: ${{ needs.build.outputs.wheel }}
        run: |
          if [ "$DESTINATION" = testpypi ]; then index=https://test.pypi.org/simple; else index=https://pypi.org/simple; fi
          python -m venv .runlogs/published-venv
          .runlogs/published-venv/bin/python -m pip download --no-deps \
            --index-url "$index" "$NAME==$VERSION" --dest .runlogs/published-download
          cmp "dist/packages/$WHEEL" ".runlogs/published-download/$WHEEL"
          .runlogs/published-venv/bin/python -m pip install ".runlogs/published-download/$WHEEL[mcp]"
          mkdir .runlogs/published-smoke
          cp scripts/check_package_install.py scripts/package_crawl_probe.py .runlogs/published-smoke/
          (cd .runlogs/published-smoke && ../published-venv/bin/python check_package_install.py \
            --installed --expect-mcp yes --work-dir ..)
